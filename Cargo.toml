[package]
name = "upkeep"
version = "0.1.7"
edition = "2021"
description = "Arch Linux system updater TUI"
license = "MIT"
repository = "https://github.com/jakeb-grant/upkeep"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
dirs = "5"
rss = "2.0"
chrono = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
